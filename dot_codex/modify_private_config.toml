#!/usr/bin/env python3
"""Keep Codex's terminal theme while preserving its local settings."""

import re
import sys
import tomllib


original = sys.stdin.read()
tomllib.loads(original)
lines = original.splitlines(keepends=True)
theme = 'theme = "dracula"\n'
table = re.compile(r"^\s*\[.*\]\s*(?:#.*)?$")

for index, line in enumerate(lines):
    if line.strip().split(" #", 1)[0] == "[tui]":
        end = next(
            (i for i in range(index + 1, len(lines)) if table.match(lines[i])),
            len(lines),
        )
        for i in range(index + 1, end):
            if re.match(r"^\s*theme\s*=", lines[i]):
                lines[i] = theme
                break
        else:
            if end > 0 and not lines[end - 1].endswith("\n"):
                lines[end - 1] += "\n"
            lines.insert(end, theme)
        break
else:
    if lines and lines[-1].strip():
        lines.append("\n")
    lines.extend(("[tui]\n", theme))

result = "".join(lines)
tomllib.loads(result)
sys.stdout.write(result)
