# Default config
# https://starship.rs/config/#prompt

scan_timeout = 10
command_timeout = 500

format = """
$username\
$hostname\
$localip\
${env_var.GIT_SUPERPROJECT_PREFIX}\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$terraform\
$aws\
$env_var\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$time\
$status\
$os\
$container\
$shell\
$character"""

[character]
success_symbol = '[\$](bold fg:#b08ae6)'
error_symbol = '[\$](bold fg:#ff6e88)'

[directory]
read_only = " "
truncation_length = 8
truncate_to_repo = true
style = 'bold fg:#b08ae6'

[env_var.GIT_SUPERPROJECT_PREFIX]
format = '[$env_value]($style)'
style = 'bold fg:#8d79a8'

[git_branch]
style = 'bold fg:#c9a8f4'

[hostname]
ssh_only = true
format = "[$hostname]($style): "
style = "fg:#8d79a8"
disabled = false

[username]
style_user = "green"
show_always = true
disabled = true

[git_metrics]
disabled = true

[git_status]
ahead = "⇡"
behind = "⇣"
style = 'bold fg:#ff6e88'

[kubernetes]
disabled = true

[docker_context]
disabled = true

[buf]
disabled = true

[terraform]
disabled = true

[hg_branch]
disabled = true

[aws]
force_display = false
