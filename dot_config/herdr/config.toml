# Written back by herdr itself after the first-run notification prompt.
onboarding = false

[theme]
name = "catppuccin"

# サイドバーのフォーカス行と選択面を、黒背景に馴染む暗い紫にする。
# agents 欄・spaces 欄で使うトークンが違うので 3 つとも同じ値にする。
[theme.custom]
panel_bg = "#0b0912"
sidebar_bg = "#0b0912"
active_row_bg = "#2b2038"
selection_bg = "#2b2038"
surface_dim = "#2b2038"

[ui]
# tmux: prefix+c creates a window immediately; skip herdr's tab-name prompt
# (tabs get generated names, rename later with prefix+shift+t).
prompt_new_tab_name = false

# Show detected agent names (claude, etc.) on split pane borders — the herdr
# counterpart of the tmux window-status Claude glyphs: see what runs where.
show_agent_labels_on_pane_borders = true

# 単独ペインにも枠を描く。既定の auto は分割したペインにしか枠を出さないので、
# タブに 1 枚しかない Claude のペインは枠ごと消え、show_agent_labels_on_pane_borders
# で出るはずのエージェント名も一緒に消えていた（「これは claude のペインだ」が
# 一番分かりにくいのがその状態）。always なら 1 枚でも枠と名前が出る。
pane_borders = "always"

# Agent panel grouped per workspace. priority（入力待ちを最上段に浮かせる
# フラットな行列）も試したが、行がスペースをまたいで並び替わるので「どの
# claude がどこの子か」を毎回読み直すことになった。グループなら位置が固定で、
# 入力待ちは state_icon の色で十分に目に付く。取りうる値は spaces /
# workspaces / priority。
agent_panel_sort = "spaces"

# フォーカス pane の枠・ハイライト・ナビ UI の色を WezTerm のカーソルと揃える。
accent = "#b08ae6"

# タブバーは下。tmux の status-bar が下にあったのと同じ位置で、視線が
# シェルのプロンプト付近から動かずに済む。
tab_bar_position = "bottom"

# タブバー右端に、全ワークスペースのエージェント状態の集計を出す（tmux の
# ステータスバーに出していた Claude カウンタの置き換え）。herdr にはタブごとに
# 状態を出す設定が無いので、まず「どこかに入力待ちが居るか」を一目で分かる
# ようにする。command は herdr サーバー側で解決・実行される。
tab_bar_right = [
  { type = "command", command = "~/.local/bin/herdr-agent-status", interval_seconds = 5, timeout_seconds = 2 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = "  ·  "

# スペース名はハッシュで決めた色で出す（同じスペース = 同じ色）。
# サイドバーは行の背景を塗れず（fg/bold/dim のみ）、
# トークンの前景色を値ごとの rules で変えるだけだが 16 ルールまでなので、
# 代わりにプラグイン kabe.space-color（plugins/space-color）が各ペインに
# $s0〜$s6 のうち 1 つだけを報告し、ここでトークンごとの色を当てる。
# 報告の無いトークンは出ない。
# 色は ~/.local/bin/herdr-space-color --toml の出力（貼り直せば同期する）。
[ui.sidebar.agents]
rows = [["state_icon", { token = "$s0", fg = "#e46876" }, { token = "$s1", fg = "#ffa066" }, { token = "$s2", fg = "#e6c384" }, { token = "$s3", fg = "#98bb6c" }, { token = "$s4", fg = "#a3d4d5" }, { token = "$s5", fg = "#7e9cd8" }, { token = "$s6", fg = "#957fb8" }, "tab"], ["agent"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[keys]
# Aligned with the tmux bindings (see dot_tmux.conf) so muscle memory carries
# over. herdr defaults that already match tmux are not repeated here:
# pane nav prefix+h/j/k/l, new tab prefix+c, next/prev tab prefix+n/p,
# picker prefix+w, zoom prefix+z, close pane prefix+x.
# When herdr runs INSIDE tmux, tmux eats C-q first — press C-q C-q
# (send-prefix) to reach herdr.
prefix = "ctrl+q"

# tmux: C-q d detaches (herdr default was prefix+q).
detach = "prefix+d"

# tmux: C-q r reloads the config; resize moves to shift+r (tmux used
# H/J/K/L repeat-resize, which herdr models as a resize MODE instead).
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# 新規タブは現在のタブの右隣に作る（tmux の後ろに足す挙動より、作った直後に
# prefix+p で元へ戻れる方が使いやすい）。herdr に挿入位置の設定は無いので、
# prefix+c は herdr-new-tab（作ってから tab.move で隣へ寄せる）に差し替え、
# 組み込みの new_tab は末尾に足したいとき用に shift+c へ退避する。
new_tab = "prefix+shift+c"

# tmux: C-q " splits below, C-q % splits right.
split_horizontal = 'prefix+"'
split_vertical = "prefix+%"

# herdr's built-in goto picker, at its default spot; bare C-g goes to the
# fzf+ghq launcher below instead (tmux muscle memory).
goto = "prefix+g"

# Cycle workspaces with prefix+u/i (unset in herdr by default): both sit
# under the right hand, u = down the sidebar list (next), i = up (previous).
# Tab nav stays on n/p.
next_workspace = "prefix+u"
previous_workspace = "prefix+i"

# Jump back to the last focused pane, across workspaces — herdr's closest
# thing to "last workspace". Same key as tmux's last-pane.
last_pane = "prefix+;"

# Cycle focus between detected agent panes (claude etc.) across the whole
# session — next_agent/previous_agent are unset in herdr by default. The
# arrows match the agent panel's vertical attention queue: down = next,
# up = previous. Note in tmux prefix+up/down means select-pane.
next_agent = "prefix+down"
previous_agent = "prefix+up"

# ghq repo launcher on bare C-g, same as the tmux session selector: jump to
# an open workspace or create one from a ghq repo. Inside tmux, tmux's own
# C-g binding wins — this applies when herdr runs directly in the terminal.
# popup, not pane: a temporary pane is spliced into the tile area, so every
# invocation shrinks the existing panes and reflows the tab. A popup is modal,
# leaves the layout alone, and takes all key input until the command exits.
[[keys.command]]
key = "ctrl+g"
type = "popup"
command = "~/.local/bin/herdr-repo-selector"
width = "80%"
height = "70%"

# prefix+c を組み込みの new_tab から差し替える。type = "shell" はデタッチ実行で
# TTY を持たない（このスクリプトは API を叩くだけで UI を出さない）。
[[keys.command]]
key = "prefix+c"
type = "shell"
command = "~/.local/bin/herdr-new-tab"

# ポップアップターミナル。C-q m または exit（C-d）で閉じる。
# cwd はアクティブ pane に従う。
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "~/.local/bin/herdr-popup-shell"
description = "popup terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+enter"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "kabe.herdr-party.toggle"
description = "party pane"

[experimental]
# Pass the kitty graphics protocol through to panes, so image output
# (wezterm imgcat, nvim image previews, etc.) renders inside herdr.
kitty_graphics = true

# While prefix mode is active, flip the macOS input source to an ASCII
# layout and restore it after, so C-q commands register even with the
# Japanese IME on. macOS-only, best-effort.
switch_ascii_input_source_in_prefix = true

reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]
